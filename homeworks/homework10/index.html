<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>

    <style>
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
        transition: 0.3s;
      }

      body.dark {
        background: linear-gradient(135deg, #1e293b, #0f172a);
        color: white;
      }

      body.light {
        background: #f1f5f9;
        color: #0f172a;
      }

      .form-card {
        width: 100%;
        max-width: 700px;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        transition: 0.3s;
      }

      body.dark .form-card {
        background: #111827;
      }

      body.light .form-card {
        background: white;
      }

      input,
      textarea,
      select {
        padding: 14px;
        border: none;
        border-radius: 12px;
        outline: none;
        transition: 0.3s;
      }

      body.dark input,
      body.dark textarea,
      body.dark select {
        background: #1e293b;
        color: white;
      }

      body.light input,
      body.light textarea,
      body.light select {
        background: #e2e8f0;
        color: black;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .full {
        grid-column: 1 / -1;
      }

      .buttons {
        display: flex;
        gap: 15px;
        margin-top: 25px;
      }

      button {
        flex: 1;
        padding: 15px;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
      }

      .theme-box {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 20px;
      }

      select {
        cursor: pointer;
      }

      @media (max-width: 700px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>

    <script defer src="index.js"></script>
  </head>

  <body>
    <form id="formcard" class="form-card">
      <div class="theme-box">
        <select id="themeSelect">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </div>

      <h1>Реєстраційна форма</h1>
      <p>Приклад сучасної HTML форми з різними елементами</p>

      <div class="grid">
        <div class="field">
          <label>Ім'я</label>
          <input type="text" name="name" placeholder="Введіть ім'я" />
        </div>

        <div class="field">
          <label>Прізвище</label>
          <input type="text" name="surname" placeholder="Введіть прізвище" />
        </div>

        <div class="field">
          <label>Email</label>
          <input type="email" name="email" placeholder="example@gmail.com" />
        </div>

        <div class="field">
          <label>Пароль</label>
          <input type="password" name="pwd" placeholder="********" />
        </div>

        <div class="field">
          <label>Дата народження</label>
          <input type="date" name="date" />
        </div>

        <div class="field">
          <label>Телефон</label>
          <input type="tel" name="phone" placeholder="+380..." />
        </div>

        <div class="field full">
          <label>Країна</label>
          <select name="country">
            <option value="uk">Україна</option>
            <option value="pl">Польща</option>
            <option value="ge">Німеччина</option>
            <option value="usa">США</option>
          </select>
        </div>

        <div class="field full">
          <label>Стать</label>

          <div class="radio-group">
            <label>
              <input type="radio" checked name="gender" value="m" />
              Чоловік
            </label>

            <label>
              <input type="radio" name="gender" value="w" />
              Жінка
            </label>
          </div>
        </div>

        <div class="field full">
          <label>Ваші навички</label>

          <div class="checkbox-group">
            <label><input type="checkbox" checked /> HTML</label>
            <label><input type="checkbox" /> CSS</label>
            <label><input type="checkbox" /> JavaScript</label>
            <label><input type="checkbox" /> Python</label>
          </div>
        </div>

        <div class="field full">
          <label>Рівень досвіду</label>

          <input
            type="range"
            min="0"
            max="100"
            value="50"
            id="range"
            name="exp"
            oninput="valueText.innerText = this.value + '%'"
          />

          <div class="range-value" id="valueText">50%</div>
        </div>

        <div class="field full">
          <label>Завантажити файл</label>
          <input type="file" />
        </div>

        <div class="field full">
          <label>Коментар</label>
          <textarea placeholder="Напишіть щось..."></textarea>
        </div>

        <div class="field full">
          <label>
            <input type="checkbox" name="agree" />
            Я погоджуюсь з умовами
          </label>
        </div>
      </div>

      <div class="buttons">
        <button type="submit" class="submit-btn">Відправити</button>
        <button type="reset" class="reset-btn">Очистити</button>
      </div>
    </form>
  </body>
</html>
