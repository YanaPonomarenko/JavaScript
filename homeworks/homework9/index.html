<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Форма</title>
    <style>
        .error {
            border: 2px solid red;
        }
        form {
            display: flex;
            flex-direction: column;
            width: 300px;
            gap: 10px;
        }
        input, select, textarea {
            width: 100%;
            padding: 5px;
            box-sizing: border-box;
        }
        button {
            margin-top: 10px;
            padding: 5px;
        }
    </style>
</head>
<body>
    <form name="formcard">
        <input type="text" name="name" placeholder="Ім'я">
        <input type="text" name="surname" placeholder="Прізвище">
        <input type="email" name="email" placeholder="Email">
        <input type="password" name="password" placeholder="Пароль">
        <input type="date" name="birthdate">
        <input type="text" name="phone" placeholder="+380XXXXXXXXX">
        <select name="country"></select>
        <select name="gender"></select>
        
        <div>
            <input type="checkbox" name="skills" value="JS"> JS
            <input type="checkbox" name="skills" value="Python"> Python
            <input type="checkbox" name="skills" value="Java"> Java
        </div>
        
        <textarea name="comment" placeholder="Коментар"></textarea>
        
        <div>
            <input type="checkbox" name="agreement"> Я погоджуюсь
        </div>
        
        <button type="submit">Submit</button>
    </form>
    <div id="message"></div>
    <script src="homework9.js"></script>
</body>
</html>
