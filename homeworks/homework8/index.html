<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календар</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f0f0f0;
        }
        .box {
            background: white;
            width: 450px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input, button {
            padding: 8px;
            margin: 5px;
            font-size: 16px;
        }
        button {
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
            padding: 8px 20px;
        }
        button:hover {
            background: darkblue;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background: #f0f0f0;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Календар</h2>
        <label>Month: </label>
        <input type="number" id="month" min="1" max="12" value="8">
        <label>Year: </label>
        <input type="number" id="year" value="2018">
        <button onclick="showCalendar()">Generate</button>
        <div id="calendar"></div>
    </div>

    <script src="homework8.js"></script>
</body>
</html>
